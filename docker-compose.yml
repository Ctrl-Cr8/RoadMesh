version: '3.8'

services:
  server:
    build:
      context: ./roadmesh-server
      dockerfile: ../docker/Dockerfile.server
    ports:
      - "3000:3000"
    environment:
      - HTTP_PORT=3000
      - NEARBY_RADIUS_METERS=500
      - VEHICLE_TIMEOUT_MS=10000
      - COLLISION_HORIZON_SEC=10
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server
    restart: unless-stopped

