name: roadmesh_app
description: RoadMesh - Cooperative Vehicle Awareness Platform

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Maps
  google_maps_flutter: ^2.10.0

  # Location & Sensors
  geolocator: ^13.0.2
  sensors_plus: ^6.1.1
  permission_handler: ^11.3.1

  # Networking
  web_socket_channel: ^3.0.2

  # State Management
  provider: ^6.1.2

  # UI & Alerts
  flutter_tts: ^4.2.0
  vibration: ^2.0.0

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
