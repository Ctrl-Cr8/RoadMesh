name: Node.js Server CI

on:
  push:
    branches: [ main, mizhab ]
  pull_request:
    branches: [ main, mizhab ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: roadmesh-server/package-lock.json

      - name: Install dependencies
        run: cd roadmesh-server && npm ci

      - name: Run unit & integration tests
        run: cd roadmesh-server && npm test

      - name: Build TypeScript
        run: cd roadmesh-server && npm run build
