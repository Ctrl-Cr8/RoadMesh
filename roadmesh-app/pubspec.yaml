name: roadmesh_app
description: RoadMesh - Cooperative Vehicle Awareness Platform

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Maps
  google_maps_flutter: ^2.10.0

  # Location & Sensors
  geolocator: ^13.0.2
  sensors_plus: ^6.1.1
  permission_handler: ^11.3.1

  # Networking
  web_socket_channel: ^3.0.2

  # State Management
  provider: ^6.1.2

  # UI & Alerts
  flutter_tts: ^4.2.0
  vibration: ^2.0.0

  # Battery
  battery_plus: ^6.0.3

  # Charts (Stats screen)
  fl_chart: ^0.69.0

  # Local Storage (Onboarding)
  shared_preferences: ^2.3.4

  # Logging
  logger: ^2.4.0

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron-Regular.ttf
          weight: 400
        - asset: assets/fonts/Orbitron-Medium.ttf
          weight: 500
        - asset: assets/fonts/Orbitron-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Orbitron-Bold.ttf
          weight: 700
        - asset: assets/fonts/Orbitron-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Orbitron-Black.ttf
          weight: 900
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
