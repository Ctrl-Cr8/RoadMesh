[platformio]
default_envs = debug

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

lib_deps =
    mikalhart/TinyGPSPlus @ 1.1.0
    knolleary/PubSubClient @ 2.8.0
    bblanchon/ArduinoJson @ 7.2.1

[env:debug]
build_flags =
    -DDEBUG
    -DWIFI_SSID=\"RoadMesh_Debug\"
    -DWIFI_PASSWORD=\"roadmesh123\"
    -DMQTT_HOST=\"192.168.1.100\"
    -DMQTT_PORT=1883
    -DVEHICLE_TYPE=\"CAR\"

[env:production]
build_flags =
    -DNDEBUG
    -DWIFI_SSID=\"RoadMesh_Prod\"
    -DWIFI_PASSWORD=\"roadmesh_secure\"
    -DMQTT_HOST=\"mqtt.roadmesh.net\"
    -DMQTT_PORT=1883
    -DVEHICLE_TYPE=\"CAR\"
